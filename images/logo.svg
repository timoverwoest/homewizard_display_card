<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="HomeWizard Display Card logo: a small screen with one large ring, two small rings and three bars">
  <!-- Own design for the HomeWizard Display Card (MIT). Not the HomeWizard logo. -->
  <path d="M200 392h112l18 44H182z" fill="#20242c"/>
  <rect x="16" y="88" width="480" height="312" rx="44" fill="#20242c"/>
  <rect x="34" y="106" width="444" height="276" rx="28" fill="#05070b"/>
  <!-- large ring: grid, clockwise -->
  <circle cx="140" cy="244" r="76" fill="none" stroke="#a259ff" stroke-opacity="0.3" stroke-width="22"/>
  <circle cx="140" cy="244" r="76" fill="none" stroke="#a259ff" stroke-width="22" stroke-linecap="round" stroke-dasharray="358.14 477.52" transform="rotate(-90 140 244)"/>
  <!-- small ring, top: home battery -->
  <circle cx="276" cy="186" r="38" fill="none" stroke="#b9d2e0" stroke-opacity="0.3" stroke-width="13"/>
  <circle cx="276" cy="186" r="38" fill="none" stroke="#b9d2e0" stroke-width="13" stroke-linecap="round" stroke-dasharray="143.26 238.76" transform="rotate(-90 276 186)"/>
  <!-- small ring, bottom: solar, counterclockwise -->
  <circle cx="276" cy="302" r="38" fill="none" stroke="#86d03c" stroke-opacity="0.3" stroke-width="13"/>
  <circle cx="276" cy="302" r="38" fill="none" stroke="#86d03c" stroke-width="13" stroke-linecap="round" stroke-dasharray="107.44 238.76" transform="matrix(-1 0 0 1 552 0) rotate(-90 276 302)"/>
  <!-- three bars: grid, solar, water -->
  <g stroke-width="14" stroke-linecap="round">
    <line x1="352" y1="174" x2="446" y2="174" stroke="#a259ff" stroke-opacity="0.3"/>
    <line x1="352" y1="174" x2="426" y2="174" stroke="#a259ff"/>
    <line x1="352" y1="244" x2="446" y2="244" stroke="#86d03c" stroke-opacity="0.3"/>
    <line x1="352" y1="244" x2="404" y2="244" stroke="#86d03c"/>
    <line x1="352" y1="314" x2="446" y2="314" stroke="#3d8ff5" stroke-opacity="0.3"/>
    <line x1="352" y1="314" x2="384" y2="314" stroke="#3d8ff5"/>
  </g>
</svg>
